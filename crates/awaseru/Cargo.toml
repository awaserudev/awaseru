[package]
name = "awaseru"
description = "Verified reimplementation harness: runs a reference emulator alongside a reimplementation and reports where their state diverges."
readme = "../../README.md"
keywords = ["verification", "emulator", "differential", "reverse-engineering"]
categories = ["development-tools", "emulators"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
awaseru-core = { path = "../awaseru-core", version = "0.0.0" }
awaseru-snes = { path = "../awaseru-snes", version = "0.0.0" }
serde = { version = "1.0.229", features = ["derive"] }
# `oid` is a default feature and brings `const-oid` for naming the algorithm in
# ASN.1, which nothing here does. Dropped (§17.2).
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
toml = "1.1.6"

[lints]
workspace = true
